description: |
  UFuse - 11 September

  𝗟𝗲𝘀𝘀𝗼𝗻: Ezequiel:   Tango Basics for Fusion Dancers
  Discover the foundations of Argentine Tango through the eyes of a Fusion dancer! ✨
  Starting from the basics: embrace, walking, connection, and musicality. We’ll explore the essential principles of tango and different ways of moving together.
  No previous tango experience is needed. Your existing Fusion skills will help you learn quickly, while the tango vocabulary and connection principles can also open up new possibilities for your Fusion dancing. 💃🕺
  Come curious, connect, and discover how tango can inspire your Fusion dance!
  
  𝗗𝗝'𝘀: 1st set: Ezequiel, 2nd set: Linda
  📅 Schedule:
  1845: Doors open
  1900 - 2000: Start Workshop 
  2000 - 2330: Music & Dancing 

  🏡 Location: 
  We get to use the lovely Centrum EMMA for our space. 
  Cremerstraat 245, 3532 BJ Utrecht
  for parking: https://www.prettigparkeren.nl/kaart/#!Utrecht/Cremerstraat_245/

  💸 Price:
  It is €8 at the door via cash or QR Code. The door price is used for the space rental and other things related to the event. If the amount would keep you from coming then feel free to pay less or none at all.

  ☕ Refreshments:
  There will be free water and tea available. You are welcome to bring your own snacks. No alcohol allowed.
