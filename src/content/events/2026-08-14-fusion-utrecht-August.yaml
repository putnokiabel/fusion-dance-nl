description: |
  UFuse - 14 August

  𝗟𝗲𝘀𝘀𝗼𝗻: Anika & Nicky
  Tarraxo is a very new dance style, slowly winning the hearts of fusion dancers. The staccato body isolations, solid leg connection, grounded nature and playful freedom it offers, makes it an ideal dance for micro-loving fusion dancers willing to expand their repertoire. Come learn the basics of the dance & the many many wonderful ways in which you can use it in your fusion dancing! 
  
  𝗗𝗝'𝘀: 1st set: Max, 2nd set: Jer
  📅 Schedule:
  1845: Doors open
  1900 - 2000: Start Workshop 
  2000 - 2330: Music & Dancing 

  🏡 Location: 
  We get to use the lovely Centrum EMMA for our space. 
  Cremerstraat 245, 3532 BJ Utrecht
  for parking: https://www.prettigparkeren.nl/kaart/#!Utrecht/Cremerstraat_245/

  💸 Price:
  It is €8 at the door via cash or QR Code. The door price is used for the space rental and other things related to the event. If the amount would keep you from coming then feel free to pay less or none at all.

  ☕ Refreshments:
  There will be free water and tea available. You are welcome to bring your own snacks. No alcohol allowed.
