description: |
  UFuse - 10 July

  𝗟𝗲𝘀𝘀𝗼𝗻: Ruben, Body Rolls
  Ruben will use his background in bachata and zouk to teach us the fundamentals of the body roll. We'll focus on relaxing the body, unlocking the chest, and staying connected with your partner throughout the movement. People frequently believe their body is just too stiff, but that is almost always untrue! Progress will feel slow and awkward, but we're doing it anyway! No previous experience is required - just come mentally prepared to struggle!
  𝗗𝗝'𝘀: 1st set: Brian, 2nd set: Ruben
  📅 Schedule:
  1845: Doors open
  1900 - 2000: Start Workshop 
  2000 - 2300: Music & Dancing 

  🏡 Location: 
  We get to use the lovely Centrum EMMA for our space. 
  Cremerstraat 245, 3532 BJ Utrecht
  for parking: https://www.prettigparkeren.nl/kaart/#!Utrecht/Cremerstraat_245/

  💸 Price:
  It is €8 at the door via cash or QR Code. The door price is used for the space rental and other things related to the event. If the amount would keep you from coming then feel free to pay less or none at all.

  ☕ Refreshments:
  There will be free water and tea available. You are welcome to bring your own snacks. No alcohol allowed.
