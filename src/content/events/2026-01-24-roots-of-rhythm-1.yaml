description: |
  Roots of Rhythm - Cultural deep dives for the fusion community
  Dance workshop - Food - Music
  Session #1: "The Origins of afrobeats" with Eric Dakpo & Anne den Otter

  Roots Of Rhythm is a new concept created especially for the fusion community. Roots Of Rhythm takes you on a journey through the origins of dance and rhythm. Afro-latin dance styles and the culture they come from have shaped Anne (the initiator of this series of cultural deep dives) as a dancer. It is her wish and vision to share the wisdom and inspiration she herself obtained from afro-latin dance cultures. Being informed by the history of a people can create more understanding about why their way of moving to music has developed the way it has. Roots of Rhythm facilitates learning about these dance cultures, in order to build a cultural awareness and depth in the fusion community. 

  Practical information:
  Dance workshop with a dinner and social dance
  Saturday 24-01-2026
  Workshop: 13.00 - 17.30 by Rick & Anne
  Dinner: 18.00 - 19.30 with Ghanese dish by Rick
  Social: 20.00 - 23.00 with music by Anne & Rick

  Location: Centrum Emma
  Cremerstraat 245/247
  3532 BJ Utrecht (10 min OV bike ride from the central station)

  Registration: https://anbacht.weticket.io/roots-of-rhythm-1

  About Eric:

  Eric has been teaching authentic Afro dance workshops for over 4 years in the Netherlands. As versatile as he is, he has also given dance workshops with other bands / groups in the Netherlands and taught children in elementary schools in the Netherlands who are very passionate or love dancing. Some of the styles he teaches are Kpanlogo, Afro-Yoga, Azonto, Amapiano. Eric is Originally from Ghana, West Africa, where he contributed a lot to the Entertainment industry as well. Eric is now based in the Netherlands, and is known as 'Mr. Gezellig'.

  About Anne:

  Anne has been teaching afro-latin dance styles for over 10 years. She was already dancing before she could walk, and has always deeply enjoyed listening and moving to music. Anne's first love has always been (Authentic Dominican) Bachata. After dancing in a Bachata showteam Anne felt it was time to start dancing for herself again. She discovered the Fusion scene right before covid hit, and the rest is history. Anne often teaches at the monthly Fusion night in Utrecht, and sometimes DJ's here as well. Anne is one of the founders of 'Playground Utrecht Fusion', a fusion festival in Utrecht, which she created together with Nicky and Abel (www.playgroundfusion.nl). 

  Pass prices:
