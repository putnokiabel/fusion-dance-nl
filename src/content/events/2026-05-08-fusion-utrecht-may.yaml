description: |
  UFuse - 8 May

  𝗟𝗲𝘀𝘀𝗼𝗻: Arielle is an independent fusion dancer and multidisciplinary artist based in NYC. Specializing in the fusion dance genre has given Arielle a unique niche in the performance world, where she most often collaborates with other dancers, musicians, and visual artists as well as integrating her own art and design work to create unusual performances throughout many different communities. Arielle’s work deliberately challenges the lines between performance and real life, seeking to reduce the distance between audience and artist until the reality is equal for all involved. When teaching workshops, Arielle’s goal
  is to liberate your social dancing and create a dancerly conversation between partners with a broader range of dynamics, movement quality, and responsive ideas. Using concepts from various partnered and solo dance forms, contact improv, abstract role play, visual art, and verbal conversational structure, Arielle helps students explore ways to free themselves from clichés and bad habits in order to develop a dynamic connection with every dance.
  www.pearling.org
  𝗗𝗝'𝘀: 1st set: Arielle, 2nd set: Ezequiel

  📅 Schedule:
  1845: Doors open
  1900 - 2000: Start Workshop 
  2000 - 2300: Music & Dancing 

  🏡 Location: 
  We get to use the lovely Centrum EMMA for our space. 
  Cremerstraat 245, 3532 BJ Utrecht
  for parking: https://www.prettigparkeren.nl/kaart/#!Utrecht/Cremerstraat_245/

  💸 Price:
  It is €8 at the door via cash or QR Code. The door price is used for the space rental and other things related to the event. If the amount would keep you from coming then feel free to pay less or none at all.

  ☕ Refreshments:
  There will be free water and tea available. You are welcome to bring your own snacks. No alcohol allowed.

  𝗪𝗵𝗮𝘁 𝗶𝘀 𝗳𝘂𝘀𝗶𝗼𝗻 𝗱𝗮𝗻𝗰𝗲? If you are familiar with one or more couple dances and like to integrate and/or combine them with music-improvisation, in which you can determine by dance(partner) whether you lead, follow or interchange/switch, then you like fusion dancing! 😃
  There'll be a wide array of music genres to get you dancing, from electronic to acoustic, evoking dance genres like blues, west coast swing, tango, balfolk, latin and more. 

  If it interests you, ask the organizers how you can participate. Maybe you want to teach a workshop, want to DJ or help out by managing a night, please let us know!

