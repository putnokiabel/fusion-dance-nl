description: |
  UFuse - 12 June

  𝗟𝗲𝘀𝘀𝗼𝗻: Max Kahan, recently moved from Bristol where he was a active part of the fusion scene. For June he has a workshop prepared where  you’ll learn how to listen to your *real* dance partner: the floor. Don’t worry, your human dance partner can join in too 🤷

  You’ll learn how to connect with a partner, how to move with them and how to make even walking feel musical. You’ll use everything you learn here for a long time!
  𝗗𝗝'𝘀: 1st set: Max, 2nd set: Ruben
  There will be a surprise between the Dj sets

  📅 Schedule:
  1845: Doors open
  1900 - 2000: Start Workshop 
  2000 - 2300: Music & Dancing 

  🏡 Location: 
  We get to use the lovely Centrum EMMA for our space. 
  Cremerstraat 245, 3532 BJ Utrecht
  for parking: https://www.prettigparkeren.nl/kaart/#!Utrecht/Cremerstraat_245/

  💸 Price:
  It is €8 at the door via cash or QR Code. The door price is used for the space rental and other things related to the event. If the amount would keep you from coming then feel free to pay less or none at all.

  ☕ Refreshments:
  There will be free water and tea available. You are welcome to bring your own snacks. No alcohol allowed.

  𝗪𝗵𝗮𝘁 𝗶𝘀 𝗳𝘂𝘀𝗶𝗼𝗻 𝗱𝗮𝗻𝗰𝗲? If you are familiar with one or more couple dances and like to integrate and/or combine them with music-improvisation, in which you can determine by dance(partner) whether you lead, follow or interchange/switch, then you like fusion dancing! 😃
  There'll be a wide array of music genres to get you dancing, from electronic to acoustic, evoking dance genres like blues, west coast swing, tango, balfolk, latin and more. 

  If it interests you, ask the organizers how you can participate. Maybe you want to teach a workshop, want to DJ or help out by managing a night, please let us know!

